<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오톡 챗봇 관리 패널</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #ffeb3b; font-size: 20px; margin-bottom: 20px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background: #2c2c2c; color: white; outline: none; }
        button { background: #4caf50; color: white; font-weight: bold; cursor: pointer; }
        .danger-btn { background: #f44336; }
        .locked-btn { background: #555; color: #aaa; cursor: not-allowed; }
        .section-title { font-size: 14px; color: #888; margin-top: 20px; margin-bottom: 5px; }
        .status { text-align: center; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🤖 카카오톡 챗봇 제어 패널</h2>

        <!-- 1. 기본 기능 (누구나 사용 가능) -->
        <div class="section-title">📂 기본 기능 (무료)</div>
        <button onclick="triggerAction('basic_macro')">매크로 기본 실행</button>
        <button onclick="triggerAction('delt')">선택 유저 강퇴 (delt)</button>

        <!-- 2. 유료 기능 (올킥 등) -->
        <div class="section-title">👑 프리미엄 기능 (유료키 필요)</div>
        
        <!-- 인증 전 입력 박스 -->
        <div id="authBox">
            <input type="text" id="licenseKey" placeholder="프리미엄 라이선스 키 입력">
            <button onclick="verifyKey()" style="background: #ff9800;">유료키 인증하기</button>
            <div id="authMsg" class="status"></div>
        </div>

        <!-- 인증 성공 시 활성화되는 유료 버튼 -->
        <div id="premiumPanel" style="display: none;">
            <p style="color: #4caf50; text-align: center; font-size: 13px; margin: 5px 0;">✔ 프리미엄 인증 완료!</p>
            <button onclick="triggerAction('allkick')" class="danger-btn">🔥 전체 올킥 실행</button>
        </div>
        
        <!-- 인증 전에는 잠겨 있는 버튼 예시 -->
        <button id="lockedAllKickBtn" class="locked-btn" onclick="alert('유료키 인증이 필요한 기능입니다!')">🔥 전체 올킥 실행 (잠김)</button>
    </div>

    <script>
        // 사용할 수 있는 유료키 리스트 (나중에 구글 시트나 DB로 연동 가능)
        const validKeys = ["VIP-1234", "ADMIN-9999", "PASS-2026"];

        function verifyKey() {
            const inputVal = document.getElementById('licenseKey').value.trim();
            const msgDiv = document.getElementById('authMsg');

            if (validKeys.includes(inputVal)) {
                msgDiv.style.color = "#4caf50";
                msgDiv.innerText = "인증 성공!";
                
                // 인증 성공 시 입력창 숨기고 진짜 유료 버튼 보여주기
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('lockedAllKickBtn').style.display = 'none';
                document.getElementById('premiumPanel').style.display = 'block';
            } else {
                msgDiv.style.color = "#f44336";
                msgDiv.innerText = "유효하지 않은 라이선스 키입니다.";
            }
        }

        function triggerAction(actionType) {
            if(actionType === 'basic_macro') {
                alert("기본 매크로가 실행되었습니다.");
            } else if(actionType === 'delt') {
                alert("delt 명령어가 전송되었습니다.");
            } else if(actionType === 'allkick') {
                alert("🔥 올킥 명령어가 전송되었습니다! (유료 기능 동작)");
            }
        }
    </script>

</body>
</html>

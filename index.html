<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>매크로 제어 패널</title>
</head>
<body style="padding: 20px; font-family: sans-serif;">
    <h2>🤖 카카오톡 매크로 제어 패널</h2>
    
    <form id="macroForm">
        <label><b>[메크로설정]</b></label><br><br>
        
        <label>방이름 (,로 여러 개 가능):</label><br>
        <input type="text" id="roomName" placeholder="예: 방이름1,방이름2" style="width: 100%; padding: 8px; margin-bottom: 10px;" required><br>
        
        <label>보낼 메시지 (이모지 허용):</label><br>
        <textarea id="message" placeholder="보낼 메시지를 입력하세요 (예: 👋 안녕하세요!)" style="width: 100%; height: 80px; padding: 8px; margin-bottom: 10px;" required></textarea><br>
        
        <label>주기 (단위 초):</label><br>
        <input type="number" id="interval" placeholder="예: 5" style="width: 100%; padding: 8px; margin-bottom: 15px;" required><br>
        
        <button type="submit" style="width: 100%; padding: 12px; background: #00C73C; color: white; font-weight: bold; border: none; border-radius: 5px;">매크로 시작하기</button>
    </form>

    <p id="result" style="margin-top: 15px; font-weight: bold;"></p>

    <script>
        document.getElementById('macroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rooms = document.getElementById('roomName').value;
            const message = document.getElementById('message').value;
            const interval = document.getElementById('interval').value;
            
            // 아까 Serveo에서 발급받은 본인의 터널링 주소를 여기에 넣으세요!
            const tunnelUrl = 'https://df699b682e4953c8-58-121-227-252.serveousercontent.com/api/macro';

            const res = document.getElementById('result');
            res.innerText = "전송 중...";

            try {
                const response = await fetch(tunnelUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rooms, message, interval })
                });
                
                if (response.ok) {
                    res.innerText = "✅ 매크로 설정이 Termux로 전송되었습니다!";
                    res.style.color = "green";
                } else {
                    res.innerText = "❌ 전송 실패 (Termux 터널링 주소나 서버를 확인하세요)";
                    res.style.color = "red";
                }
            } catch (err) {
                res.innerText = "❌ 에러 발생: 폰 서버가 켜져 있는지 확인하세요.";
                res.style.color = "red";
            }
        });
    </script>
</body>
</html>
